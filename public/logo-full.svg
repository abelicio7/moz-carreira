<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logo-gradient-full" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Logo Mark (scaled down to 50x50, positioned at x=10, y=15) -->
  <g transform="translate(10, 15) scale(0.5)">
    <!-- Stylized M shape with upward growth lines -->
    <path d="M20 75V35L45 58L55 58L80 35V75" stroke="url(#logo-gradient-full)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Rocket/growth path rising from the center M -->
    <path d="M50 50L50 25" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M42 33L50 25L58 33" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text "Moz Carreira" -->
  <text x="70" y="49" font-family="'Sora', 'Manrope', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#1e3a8a" letter-spacing="-0.5">Moz</text>
  <text x="138" y="49" font-family="'Sora', 'Manrope', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#10b981" letter-spacing="-0.5">Carreira</text>
</svg>
